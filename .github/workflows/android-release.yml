name: Build and release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sp500-apk-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Install Android SDK
        run: |
          set -euo pipefail
          SDK_ROOT="$HOME/android-sdk"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          curl -fsSL -o /tmp/cmdtools.zip "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          rm -rf /tmp/cmdline-tools
          unzip -q /tmp/cmdtools.zip -d /tmp/cmdline-tools-unpack
          rm -rf "$SDK_ROOT/cmdline-tools/latest"
          mv /tmp/cmdline-tools-unpack/cmdline-tools "$SDK_ROOT/cmdline-tools/latest"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/build-tools/34.0.0" >> "$GITHUB_PATH"
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "platform-tools"

      - name: Prepare release keystore
        working-directory: android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${ANDROID_KEYSTORE_BASE64}" ] && [ -n "${ANDROID_KEYSTORE_PASSWORD}" ] && [ -n "${ANDROID_KEY_ALIAS}" ] && [ -n "${ANDROID_KEY_PASSWORD}" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > sp500-release.keystore
            if [ ! -s sp500-release.keystore ]; then
              echo "ANDROID_KEYSTORE_BASE64 no produjo un keystore."
              exit 1
            fi
            keytool -list -keystore sp500-release.keystore -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null
            echo "KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "Usando la llave de firma estable guardada en los secretos del repositorio."
          else
            echo "Faltan secretos de firma (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD)."
            echo "Se genera una llave temporal. Android puede exigir desinstalar la versión anterior para instalar esta."
            keytool -genkeypair -v \
              -keystore sp500-release.keystore \
              -alias sp500 \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=SP500 Panel, OU=Education, O=SP500, L=Mazatlan, ST=Sinaloa, C=MX"
          fi

      - name: Build release APK
        working-directory: android
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          APK="$(find app/build/outputs/apk/release -type f -name '*.apk' ! -name '*unsigned*' | head -n 1)"
          if [ -z "$APK" ]; then
            echo "No se generó el APK firmado"
            find app/build/outputs -type f || true
            exit 1
          fi
          cp "$APK" "$RUNNER_TEMP/sp500-panel.apk"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose "$RUNNER_TEMP/sp500-panel.apk"
          echo "APK listo: $APK"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          APK="$RUNNER_TEMP/sp500-panel.apk"
          test -f "$APK"
          NOTES="$(cat <<'EOF'
          Panel educativo SP&500 para Android, con pestaña Simulador (paper trading ficticio).

          Descarga **sp500-panel.apk** e instálalo permitiendo aplicaciones de orígenes desconocidos (Ajustes → Seguridad → Instalar apps desconocidas).

          Los datos de mercado vienen de TradingView y pueden tener retraso. La simulación lee data/simulador.json; si ese archivo no existe, la app dice que aún no hay datos. Esto no es asesoría financiera ni una recomendación de compra o venta.

          La v1.0.0 se firmó con una llave de un solo uso. Para instalar esta versión encima de aquella, desinstala la app una vez. Si el repositorio tiene los secretos ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS y ANDROID_KEY_PASSWORD, las siguientes compilaciones usan esa misma llave y se pueden instalar encima. Si esos secretos no están, cada APK lleva una llave nueva y hay que desinstalar antes de actualizar.
          EOF
          )"
          if gh release view v1.1.0 >/dev/null 2>&1; then
            gh release upload v1.1.0 "$APK" --clobber
            gh release edit v1.1.0 --title "SP&500 v1.1.0" --notes "$NOTES" --latest
          else
            gh release create v1.1.0 "$APK" \
              --title "SP&500 v1.1.0" \
              --notes "$NOTES" \
              --latest
          fi
          gh release view v1.1.0 --json url,tagName,assets
