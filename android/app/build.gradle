plugins {
    id "com.android.application"
}

android {
    namespace "com.sp500.panel"
    compileSdk 34

    defaultConfig {
        applicationId "com.sp500.panel"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    signingConfigs {
        release {
            def storePath = System.getenv("KEYSTORE_FILE") ?: "${rootDir}/sp500-release.keystore"
            storeFile file(storePath)
            storePassword System.getenv("KEYSTORE_PASSWORD") ?: "android"
            keyAlias System.getenv("KEY_ALIAS") ?: "sp500"
            keyPassword System.getenv("KEY_PASSWORD") ?: "android"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// El panel vive en index.html (raíz del repo). Se copia a assets antes de empaquetar
// para que el APK use siempre esa versión, sin registrar la copia como tarea con salidas.
tasks.named("preBuild").configure {
    doFirst {
        def src = rootProject.file("../index.html")
        if (!src.exists()) {
            throw new GradleException("No se encontró el panel en ${src}. Debe existir index.html en la raíz del repositorio.")
        }
        def destDir = file("src/main/assets")
        destDir.mkdirs()
        copy {
            from src
            into destDir
        }
    }
}

configurations.configureEach {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == "org.jetbrains.kotlin" && details.requested.name.startsWith("kotlin-stdlib")) {
            details.useVersion "1.9.24"
        }
    }
}

dependencies {
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "androidx.activity:activity:1.9.3"
    implementation "androidx.webkit:webkit:1.12.1"
}
